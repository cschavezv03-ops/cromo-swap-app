name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-for-ci

  db-test:
    name: pgTAP RLS Suite
    runs-on: ubuntu-latest
    # This job requires Docker (available on ubuntu-latest GitHub runners).
    # It starts a local Supabase stack, applies all migrations, and runs the
    # pgTAP suite (supabase/tests/rls_test.sql — 58 assertions as of Phase 2).
    # Requires SUPABASE_ACCESS_TOKEN secret for `supabase link`.
    # Until the secret is wired, this job is allowed to fail so it does not
    # block merges — remove `continue-on-error` once the secret is set up.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations and run pgTAP suite
        run: |
          supabase db reset
          supabase test db
